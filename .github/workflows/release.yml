name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: write   # GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pipx install poetry
      - name: Check tag matches pyproject version
        id: version
        run: |
          v=$(poetry version -s)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The GitHub release body is this version's CHANGELOG section (Keep a Changelog
      # heading `## [X.Y.Z] - date`), not the auto-generated list of merged PRs. A tag
      # without a changelog section fails here, before anything is built or uploaded.
      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ steps.version.outputs.version }}"
          {
            echo "\`pip install statetrace-sc==$v\` (import name \`statetrace\`)."
            echo
            awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md
          } > release_notes.md
          [ "$(wc -l < release_notes.md)" -gt 3 ] || { echo "no CHANGELOG section for $v"; exit 1; }
          cat release_notes.md
      - name: Build
        id: build
        run: poetry build
      # Trusted publishing, so there is no token to check here: PyPI must list a
      # publisher for the project statetrace-sc (heart-gen/StateTrace, workflow
      # release.yml, environment pypi).
      # Without a match the OIDC exchange is refused and nothing is uploaded (as on
      # every rfmix_reader 0.7.x tag).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # a re-run of a tag already uploaded by hand must not fail on the files
          # being there
          skip-existing: true
      # The release names the tag and carries the artifacts, so it does not depend on
      # the upload having worked: a failed publish must not skip it. `always()` would
      # also run this step after a failed build, hence the outcome guard.
      - name: GitHub release
        if: always() && steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: StateTrace ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: false
          files: dist/*
